[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boox-ro"
version = "0.2.1"
description = "Framework open-source de gestao de risco operacional e controles internos para instituicoes financeiras brasileiras"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Walter C. Neto" }
]
keywords = ["risco-operacional", "controles-internos", "rcsa", "cmn-4557", "bsm-pqo", "20-box"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
# NOTA: A engine de calculo (compute, render, suficiencia, gap_regulatorio)
# roda APENAS com a biblioteca padrao do Python. Zero dependencias de rede.
# openpyxl e usado so no gerador de templates (opcional).
dependencies = []

[project.optional-dependencies]
templates = ["openpyxl>=3.1"]

[project.urls]
Homepage = "https://github.com/walterCNeto/BooX"
Repository = "https://github.com/walterCNeto/BooX"
Issues = "https://github.com/walterCNeto/BooX/issues"

[project.scripts]
boox = "boox.__main__:main"
boox-gap = "boox.gap_regulatorio:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["boox*"]
exclude = ["examples*", "tests*"]

[tool.setuptools.package-data]
boox = ["../canonico/*.csv", "../canonico/VERSION"]
